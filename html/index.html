<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>nocturne_hud</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="vignette"></div>
<div id="cine"><i></i><i></i></div>
<div id="notifs"></div>
<div id="hud">
  <div id="layer">
    <div id="mapFrame"><i></i></div>
    <div class="el" data-el="info" style="top:28px;right:32px;align-items:center;gap:10px">
      <span style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.25"><span class="sm muted" id="clock"></span><span class="sm accent" id="gclock" style="font-weight:600"></span></span><i class="dot"></i><span class="sm muted" id="players"></span><span class="idtag">ID <b id="pid"></b></span>
    </div>
    <div class="el money" data-el="cash" style="top:76px;right:32px"><span id="cashDelta" class="delta"></span><span id="cash" class="big"></span></div>
    <div class="el money" data-el="bank" style="top:102px;right:32px"><span class="soft bankl" style="font-size:12px">Banque <span id="bank"></span></span></div>
    <div class="el" data-el="job" style="top:122px;right:32px"><span class="soft" style="font-size:11.5px" id="job"></span></div>
    <div class="el" data-el="weapon" style="top:146px;right:32px"><span class="lbl wtag">ARME</span><span id="ammo" class="big"></span><span class="dim" style="font-size:12px">/ <span id="reserve"></span></span></div>
    <div class="el" data-el="street" id="streetEl" style="left:30px;align-items:center;gap:10px">
      <span id="heading" class="accent" style="font-size:13px;font-weight:600;letter-spacing:.06em"></span><i class="vbar"></i><span id="street" style="font-size:13px;font-weight:500"></span><span id="zone" class="muted" style="font-size:12px"></span>
    </div>

    <div id="stats"></div>
    <div class="stat" data-stat="voice" id="voice" title="Voix">
      <div class="vcirc" id="vcirc"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4"/></svg></div>
      <div style="display:flex;flex-direction:column;gap:3px"><div class="rbars"><i></i><i></i><i></i></div><span id="radio" class="accent" style="font-size:9.5px;letter-spacing:.14em">RADIO</span></div>
    </div>

    <div class="el" data-el="vehicle" id="veh" style="right:36px;bottom:30px;flex-direction:column;align-items:center;gap:6px">
      <div style="display:flex;align-items:center;gap:18px">
        <div id="altBox" style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
          <span class="lbl">ALT</span><span id="alt" style="font-size:28px;font-weight:500;line-height:1"></span><span class="lbl">FT</span><span id="vs" style="font-size:12px;margin-top:6px"></span>
        </div>
        <div style="position:relative;width:200px;height:170px">
          <div class="gdisc"></div>
          <svg width="200" height="170" viewBox="0 0 160 136" style="position:absolute;inset:0;overflow:visible">
            <defs><linearGradient id="gRpm" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent3)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient></defs>
            <path d="M28.9 109.5L22.8 113.0 M20.8 101.5L18.0 102.6 M18.0 90.9L15.0 91.5 M17.0 80.0L14.0 80.0 M21.9 69.8L15.0 68.5 M20.8 58.5L18.0 57.4 M25.4 48.5L22.8 47.0 M31.7 39.5L29.4 37.6 M42.1 34.8L37.6 29.4 M48.5 25.4L47.0 22.8 M58.5 20.8L57.4 18.0 M69.1 18.0L68.5 15.0 M80.0 21.0L80.0 14.0 M90.9 18.0L91.5 15.0 M101.5 20.8L102.6 18.0 M111.5 25.4L113.0 22.8 M117.9 34.8L122.4 29.4 M128.3 39.5L130.6 37.6 M134.6 48.5L137.2 47.0 M139.2 58.5L142.0 57.4 M138.1 69.8L145.0 68.5 M143.0 80.0L146.0 80.0 M142.0 90.9L145.0 91.5 M139.2 101.5L142.0 102.6 M131.1 109.5L137.2 113.0" stroke="rgba(233,233,237,.28)" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M19.4 115 A70 70 0 1 1 140.6 115" fill="none" stroke="rgba(233,233,237,.10)" stroke-width="5" stroke-linecap="round"/>
            <path id="red" d="M19.4 115 A70 70 0 1 1 140.6 115" fill="none" stroke="rgba(214,90,90,.6)" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="0 85 15 0"/>
            <path id="rpm" d="M19.4 115 A70 70 0 1 1 140.6 115" fill="none" stroke="url(#gRpm)" stroke-width="5" class="rpmglow" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" style="transition:stroke-dasharray .12s linear"/>
          </svg>
          <div id="cruise" class="accent" style="position:absolute;left:0;right:0;top:30px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.14em"></div>
          <svg id="bl" width="18" height="18" viewBox="0 0 24 24" style="position:absolute;left:30px;bottom:4px"><path d="M3 12 10 5v4h8v6h-8v4z" fill="#6fb38a"/></svg>
          <svg id="br" width="18" height="18" viewBox="0 0 24 24" style="position:absolute;right:30px;bottom:4px"><path d="M21 12 14 5v4H6v6h8v4z" fill="#6fb38a"/></svg>
          <div style="position:absolute;left:0;right:0;top:52px;display:flex;flex-direction:column;align-items:center">
            <span id="speed" style="font-size:54px;font-weight:600;line-height:1;letter-spacing:-.03em"></span>
            <span id="unit" class="lbl" style="margin-top:4px"></span>
            <span id="odo" class="lbl" style="margin-top:4px;font-size:11.5px;opacity:.9;letter-spacing:.04em;white-space:nowrap"></span>
          </div>
          <div style="position:absolute;left:0;right:0;bottom:6px;text-align:center"><span id="gear" class="gearb"></span></div>
        </div>
      </div>
      <div class="vbarline">
        <span id="vtLabel" class="lbl"></span>
        <div id="fuelBox" title="Carburant" style="display:flex;align-items:center;gap:6px">
          <svg class="i14" viewBox="0 0 24 24" id="fuelIc"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h14M5 10h10M15 8l3 3v6a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg>
          <div class="ftrack"><div id="fuel"></div></div><span id="range" class="lbl"></span>
        </div>
        <svg id="beltIc" class="i16" viewBox="0 0 24 24"><path d="M12 6.5a2 2 0 1 0 0-.01M8 21l1.5-8h5L16 21M7 9l10 8"/></svg>
        <svg id="lightIc" class="i16" viewBox="0 0 24 24"><path d="M10 6C6.5 6 4 8.7 4 12s2.5 6 6 6h1V6zM15 8h6M15 12h6M15 16h6"/></svg>
        <svg id="engIc" class="i16" viewBox="0 0 24 24"><path d="M4 10h3l2-2h5l2 2h2v6h-2l-2 2H9l-2-2H4zM2 12v2M21 11v4"/></svg>
      </div>
    </div>
  </div>
</div>

<div id="tip">Glisse chaque élément où tu veux · clique pour le sélectionner</div>
<div id="panel">
  <div class="phead">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><b>Réglages du HUD</b><span class="dim" style="font-size:11px">Enregistré automatiquement</span></div>
    <button class="ghost" id="flip" title="Changer de côté">⇄</button>
    <button class="ghost" id="mini" title="Réduire">—</button>
  </div>
  <div id="pbody"></div>
  <div class="pfoot"><button class="sec" id="resetPos">Réinitialiser positions</button><button class="pri" id="closeBtn">Fermer</button></div>
</div>
<script src="app.js"></script>
</body>
</html>
